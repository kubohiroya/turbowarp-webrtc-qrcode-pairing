<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><rect width="480" height="360" fill="#f4f7fc"/><rect x="0" y="0" width="480" height="60" fill="#16335c"/><g font-family="Arial,sans-serif"><text x="18" y="39" font-size="24" fill="white">Pair two devices</text><text x="18" y="88" font-size="15" fill="#16335c">Host: O creates offer QR. Guest: A waits.</text><text x="18" y="113" font-size="15" fill="#16335c">C: start camera and scan one part (repeat)</text><text x="18" y="138" font-size="15" fill="#16335c">N: show next QR   S: state   X: stop/close</text><text x="18" y="163" font-size="15" fill="#16335c">Two cameras/screens needed. No audio.</text></g></svg>
